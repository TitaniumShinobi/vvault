name: AUTH product contract
on: [pull_request, push, workflow_dispatch]
permissions:
  contents: read
jobs:
  auth-product-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .auth-kit/ci.mjs verify
