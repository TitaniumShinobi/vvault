name: Deploy VVAULT

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: vvault-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 165.245.136.194
          username: deploy
          key: ${{ secrets.VVAULT_DEPLOY_KEY }}
          script: |
            tracked_changes="$(git -C /opt/vvault-public status --porcelain --untracked-files=no | wc -l | tr -d ' ')"
            untracked_changes="$(git -C /opt/vvault-public ls-files --others --exclude-standard | wc -l | tr -d ' ')"
            echo "[vvault-deploy] production worktree changes: tracked=${tracked_changes} untracked=${untracked_changes}"
            git -C /opt/vvault-public -c core.quotePath=true ls-files --others --exclude-standard \
              | sed 's|^|[vvault-deploy] untracked path: |'
            /opt/deploy/trigger/deploy-trigger.sh vvault
