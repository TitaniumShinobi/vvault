name: Deploy VVAULT

on:
  push:
    branches:
      - recovery/vvault-preview-icons
  workflow_dispatch:

concurrency:
  group: vvault-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 165.245.136.194
          username: deploy
          key: ${{ secrets.VVAULT_DEPLOY_KEY }}
          script: |
            /opt/deploy/trigger/deploy-trigger.sh vvault
