name: Deploy VVAULT

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      operation:
        description: "Tracked production operation"
        required: true
        default: deploy_backend
        type: choice
        options:
          - deploy_backend
          - deploy_full
          - configure_oauth_transaction_key
          - restore_frontend
      frontend_snapshot:
        description: "Required only for restore_frontend; exact /opt/deploy/backups/vvault-YYYYMMDD-HHMMSS snapshot"
        required: false
        type: string

concurrency:
  group: vvault-production
  cancel-in-progress: false

jobs:
  deploy-backend:
    if: github.event_name == 'push' || inputs.operation == 'deploy_backend'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VVAULT_DEPLOY_MODE: backend-only

    steps:
      - name: Restart backend from tracked checkout
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 165.245.136.194
          username: deploy
          key: ${{ secrets.VVAULT_DEPLOY_KEY }}
          envs: VVAULT_DEPLOY_MODE
          script: |
            repo=/opt/vvault-public
            git -C "$repo" fetch origin production:refs/remotes/origin/production
            if [ -n "$(git -C "$repo" status --porcelain --untracked-files=normal)" ]; then
              echo "refusing deployment: host checkout is dirty"
              exit 1
            fi
            # A clean tracked checkout may be reset safely.  This prevents a
            # stale host-side deployment script from being executed after a
            # successful fetch.
            git -C "$repo" checkout -B production origin/production
            git -C "$repo" reset --hard origin/production
            exec "$repo/scripts/deployment/droplet-deploy-vvault.sh"

  deploy-full:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy_full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VVAULT_ENROLLMENT_HMAC_KEY: ${{ secrets.VVAULT_ENROLLMENT_HMAC_KEY }}
      VVAULT_OAUTH_TRANSACTION_ENCRYPTION_KEY: ${{ secrets.VVAULT_OAUTH_TRANSACTION_ENCRYPTION_KEY }}

    steps:
      - name: Deploy full release to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 165.245.136.194
          username: deploy
          key: ${{ secrets.VVAULT_DEPLOY_KEY }}
          envs: VVAULT_ENROLLMENT_HMAC_KEY,VVAULT_OAUTH_TRANSACTION_ENCRYPTION_KEY
          script: |
            python3 - <<'PY'
            import grp
            import os
            import stat
            import tempfile
            from pathlib import Path

            secrets = {
                "VVAULT_ENROLLMENT_HMAC_KEY": os.environ.get("VVAULT_ENROLLMENT_HMAC_KEY", ""),
                "VVAULT_OAUTH_TRANSACTION_ENCRYPTION_KEY": os.environ.get("VVAULT_OAUTH_TRANSACTION_ENCRYPTION_KEY", ""),
            }
            import base64
            def valid_fernet(value):
                try:
                    return len(base64.urlsafe_b64decode(value.encode("ascii"))) == 32
                except Exception:
                    return False
            if len(secrets["VVAULT_ENROLLMENT_HMAC_KEY"]) < 32 or not valid_fernet(secrets["VVAULT_OAUTH_TRANSACTION_ENCRYPTION_KEY"]):
                raise SystemExit("required protected runtime key is unavailable")
            env_path = Path("/opt/vvault-public/.env")
            group_id = grp.getgrnam("vvault").gr_gid
            current = env_path.read_text(encoding="utf-8") if env_path.exists() else ""
            lines = [line for line in current.splitlines() if not any(line.startswith(f"{name}=") for name in secrets)]
            lines.extend(f"{name}={value}" for name, value in secrets.items())
            descriptor, temporary = tempfile.mkstemp(prefix=".env.", dir=env_path.parent)
            try:
                with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                    handle.write("\n".join(lines) + "\n")
                    handle.flush()
                    os.fsync(handle.fileno())
                os.chown(temporary, -1, group_id)
                os.chmod(temporary, stat.S_IRUSR | stat.S_IWUSR | stat.S_IRGRP)
                os.replace(temporary, env_path)
            finally:
                if os.path.exists(temporary):
                    os.unlink(temporary)
            PY
            repo=/opt/vvault-public
            git -C "$repo" fetch origin production:refs/remotes/origin/production
            if [ -n "$(git -C "$repo" status --porcelain --untracked-files=normal)" ]; then
              echo "refusing deployment: host checkout is dirty"
              exit 1
            fi
            git -C "$repo" checkout -B production origin/production
            git -C "$repo" reset --hard origin/production
            exec "$repo/scripts/deployment/droplet-deploy-vvault.sh"

  configure-oauth-transaction-key:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'configure_oauth_transaction_key'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VVAULT_OAUTH_TRANSACTION_ENCRYPTION_KEY: ${{ secrets.VVAULT_OAUTH_TRANSACTION_ENCRYPTION_KEY }}

    steps:
      - name: Provision protected OAuth transaction key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 165.245.136.194
          username: deploy
          key: ${{ secrets.VVAULT_DEPLOY_KEY }}
          envs: VVAULT_OAUTH_TRANSACTION_ENCRYPTION_KEY
          script: |
            python3 - <<'PY'
            import grp
            import os
            import stat
            import tempfile
            from pathlib import Path

            name = "VVAULT_OAUTH_TRANSACTION_ENCRYPTION_KEY"
            secret = os.environ.get(name, "")
            import base64
            try:
                valid_fernet = len(base64.urlsafe_b64decode(secret.encode("ascii"))) == 32
            except Exception:
                valid_fernet = False
            if not valid_fernet:
                raise SystemExit("required protected runtime key is unavailable")
            env_path = Path("/opt/vvault-public/.env")
            group_id = grp.getgrnam("vvault").gr_gid
            current = env_path.read_text(encoding="utf-8") if env_path.exists() else ""
            lines = [line for line in current.splitlines() if not line.startswith(f"{name}=")]
            lines.append(f"{name}={secret}")
            descriptor, temporary = tempfile.mkstemp(prefix=".env.", dir=env_path.parent)
            try:
                with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                    handle.write("\n".join(lines) + "\n")
                    handle.flush()
                    os.fsync(handle.fileno())
                os.chown(temporary, -1, group_id)
                os.chmod(temporary, stat.S_IRUSR | stat.S_IWUSR | stat.S_IRGRP)
                os.replace(temporary, env_path)
            finally:
                if os.path.exists(temporary):
                    os.unlink(temporary)
            PY
            sudo systemctl restart vvault-backend.service
            curl --fail --silent --show-error http://127.0.0.1:8000/api/ready |
              python3 -c 'import json,sys; assert json.load(sys.stdin).get("ready") is True'
            curl --fail --silent --show-error http://127.0.0.1:8000/api/auth/google/health |
              python3 -c 'import json,sys; assert json.load(sys.stdin).get("oauth_transaction_protection_ready") is True; print("oauth-transaction-protection-ready")'

  restore-frontend:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'restore_frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VVAULT_FRONTEND_SNAPSHOT: ${{ inputs.frontend_snapshot }}
      RESTORE_SOURCE_REF: release/vvault-first-developer

    steps:
      - name: Restore named frontend snapshot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 165.245.136.194
          username: deploy
          key: ${{ secrets.VVAULT_DEPLOY_KEY }}
          envs: VVAULT_FRONTEND_SNAPSHOT,RESTORE_SOURCE_REF
          script: |
            set -Eeuo pipefail
            repo=/opt/vvault-public
            [ "$RESTORE_SOURCE_REF" = "release/vvault-first-developer" ] || {
              echo "refusing an unapproved restore source ref"
              exit 1
            }
            git -C "$repo" fetch origin "$RESTORE_SOURCE_REF:refs/remotes/origin/$RESTORE_SOURCE_REF"
            restore_script="$(mktemp /tmp/vvault-frontend-restore.XXXXXX)"
            trap 'rm -f "$restore_script"' EXIT
            git -C "$repo" show "origin/$RESTORE_SOURCE_REF:scripts/deployment/restore-vvault-frontend-snapshot.sh" >"$restore_script"
            chmod 0700 "$restore_script"
            exec "$restore_script"
