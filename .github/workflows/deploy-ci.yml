name: Deploy VVAULT

on:
  push:
    branches:
      - production
  workflow_dispatch:
    inputs:
      operation:
        description: "Tracked production operation"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - restore_frontend
      frontend_snapshot:
        description: "Required only for restore_frontend; exact /opt/deploy/backups/vvault-YYYYMMDD-HHMMSS snapshot"
        required: false
        type: string

concurrency:
  group: vvault-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VVAULT_ENROLLMENT_HMAC_KEY: ${{ secrets.VVAULT_ENROLLMENT_HMAC_KEY }}

    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 165.245.136.194
          username: deploy
          key: ${{ secrets.VVAULT_DEPLOY_KEY }}
          envs: VVAULT_ENROLLMENT_HMAC_KEY
          script: |
            python3 - <<'PY'
            import grp
            import os
            import stat
            import tempfile
            from pathlib import Path

            secret = os.environ.get("VVAULT_ENROLLMENT_HMAC_KEY", "")
            if len(secret) < 32:
                raise SystemExit("VVAULT enrollment key is unavailable")
            env_path = Path("/opt/vvault-public/.env")
            group_id = grp.getgrnam("vvault").gr_gid
            current = env_path.read_text(encoding="utf-8") if env_path.exists() else ""
            lines = [line for line in current.splitlines() if not line.startswith("VVAULT_ENROLLMENT_HMAC_KEY=")]
            lines.append(f"VVAULT_ENROLLMENT_HMAC_KEY={secret}")
            descriptor, temporary = tempfile.mkstemp(prefix=".env.", dir=env_path.parent)
            try:
                with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                    handle.write("\n".join(lines) + "\n")
                    handle.flush()
                    os.fsync(handle.fileno())
                os.chown(temporary, -1, group_id)
                os.chmod(temporary, stat.S_IRUSR | stat.S_IWUSR | stat.S_IRGRP)
                os.replace(temporary, env_path)
            finally:
                if os.path.exists(temporary):
                    os.unlink(temporary)
            PY
            # Do not delegate to an unmanaged host-side trigger.  Refresh the
            # exact pushed production ref, then run the reviewed repository
            # deployment contract directly.  That contract fails before any
            # restart if migration recovery receipts are missing or invalid.
            repo=/opt/vvault-public
            git -C "$repo" fetch origin production:refs/remotes/origin/production
            if [ -n "$(git -C "$repo" status --porcelain --untracked-files=normal)" ]; then
              echo "refusing deployment: host checkout is dirty"
              exit 1
            fi
            # A clean tracked checkout may be reset safely.  This prevents a
            # stale host-side deployment script from being executed after a
            # successful fetch.
            git -C "$repo" checkout -B production origin/production
            git -C "$repo" reset --hard origin/production
            exec "$repo/scripts/deployment/droplet-deploy-vvault.sh"

  restore-frontend:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'restore_frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VVAULT_FRONTEND_SNAPSHOT: ${{ inputs.frontend_snapshot }}
      RESTORE_SOURCE_REF: release/vvault-first-developer

    steps:
      - name: Restore named frontend snapshot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 165.245.136.194
          username: deploy
          key: ${{ secrets.VVAULT_DEPLOY_KEY }}
          envs: VVAULT_FRONTEND_SNAPSHOT,RESTORE_SOURCE_REF
          script: |
            set -Eeuo pipefail
            repo=/opt/vvault-public
            [ "$RESTORE_SOURCE_REF" = "release/vvault-first-developer" ] || {
              echo "refusing an unapproved restore source ref"
              exit 1
            }
            git -C "$repo" fetch origin "$RESTORE_SOURCE_REF:refs/remotes/origin/$RESTORE_SOURCE_REF"
            restore_script="$(mktemp /tmp/vvault-frontend-restore.XXXXXX)"
            trap 'rm -f "$restore_script"' EXIT
            git -C "$repo" show "origin/$RESTORE_SOURCE_REF:scripts/deployment/restore-vvault-frontend-snapshot.sh" >"$restore_script"
            chmod 0700 "$restore_script"
            exec "$restore_script"
