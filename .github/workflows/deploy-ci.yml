name: Deploy VVAULT

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: vvault-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 165.245.136.194
          username: deploy
          key: ${{ secrets.VVAULT_DEPLOY_KEY }}
          script: |
            set -eu
            expected_untracked='vvault/server/chatty_body_service.py.incident-20260801T1201Z
            vvault/server/chatty_body_service.py.pre-projection-20260731
            vvault/server/projection_classification.py.incident-20260801T1201Z
            vvault/server/vvault_file_repository.py.incident-20260801T1201Z
            vvault/server/vvault_file_repository.py.pre-projection-20260731
            vvault/server/vvault_web_server.py.incident-20260801T1201Z
            vvault/server/vvault_web_server.py.pre-projection-20260731'
            tracked_changes="$(git -C /opt/vvault-public status --porcelain --untracked-files=no | wc -l | tr -d ' ')"
            actual_untracked="$(git -C /opt/vvault-public -c core.quotePath=false ls-files --others --exclude-standard)"
            if [ "$tracked_changes" != "0" ]; then
              echo "[vvault-deploy] tracked production changes detected; refusing preservation/deployment" >&2
              exit 1
            fi
            if [ "$actual_untracked" != "$expected_untracked" ]; then
              echo "[vvault-deploy] untracked production set changed; refusing preservation/deployment" >&2
              exit 1
            fi
            for path in $expected_untracked; do
              digest="$(sha256sum "/opt/vvault-public/$path")"
              echo "[vvault-deploy] preserved artifact sha256: $digest"
            done
            exclude_file=/opt/vvault-public/.git/info/exclude
            touch "$exclude_file"
            for path in $expected_untracked; do
              grep -Fqx "$path" "$exclude_file" || printf '%s\n' "$path" >> "$exclude_file"
            done
            if [ -n "$(git -C /opt/vvault-public status --porcelain)" ]; then
              echo "[vvault-deploy] worktree remains dirty after exact-path preservation; refusing deployment" >&2
              exit 1
            fi
            echo "[vvault-deploy] seven artifacts preserved in place and excluded by exact path"
            /opt/deploy/trigger/deploy-trigger.sh vvault
