name: Deploy VVAULT

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: vvault-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 165.245.136.194
          username: deploy
          key: ${{ secrets.VVAULT_DEPLOY_KEY }}
          script: |
            set +e
            if id -Gn | tr ' ' '\n' | grep -qx vvault; then
              chgrp vvault /opt/vvault-public/.env || exit 1
              chmod 640 /opt/vvault-public/.env || exit 1
            else
              printf 'vvault-env group-access-unavailable\n'
              exit 1
            fi
            /opt/deploy/trigger/deploy-trigger.sh vvault
            deploy_status=$?
            stat -c 'vvault-env uid=%u gid=%g mode=%a' /opt/vvault-public/.env || true
            systemctl show vvault-backend.service \
              -p User -p Group -p LoadState -p ActiveState -p SubState \
              -p Result -p ExecMainCode -p ExecMainStatus || true
            exit "$deploy_status"
