name: Deploy manager-only Wazuh

on:
  workflow_dispatch:
  push:
    branches:
      - production
    paths:
      - .github/workflows/deploy-wazuh-manager.yml
      - scripts/bootstrap-wazuh-manager-deploy.sh
      - scripts/install-wazuh-manager.sh
      - scripts/vvault-wazuh-manager-install-wrapper.sh

concurrency:
  group: vvault-wazuh-manager
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only VVAULT host preflight
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 165.245.136.194
          username: deploy
          key: ${{ secrets.VVAULT_DEPLOY_KEY }}
          script: |
            set -eu
            test "$(dpkg --print-architecture)" = amd64
            if test "$(df -Pk /var | awk 'NR==2 {print $4}')" -lt 5242880; then
              dpkg-query -W -f='${Version}' wazuh-manager | grep -qx '4.14.7-1'
              test -d /var/ossec/tmp
              test ! -L /var/ossec/tmp
            fi
            id vvault >/dev/null
            systemctl is-active vvault-backend.service >/dev/null
            test -x /usr/local/libexec/vvault-wazuh-manager-install
            sudo -n -l | grep -F '/usr/local/libexec/vvault-wazuh-manager-install' >/dev/null
            if ss -ltn | grep -Eq '(^|[[:space:]])(0\.0\.0\.0|\[::\]):55000([[:space:]]|$)'; then
              echo 'port 55000 is already publicly bound' >&2
              exit 1
            fi
            curl --fail --silent --show-error http://127.0.0.1:8000/api/ready >/dev/null

  install:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare fixed bounded stage
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 165.245.136.194
          username: deploy
          key: ${{ secrets.VVAULT_DEPLOY_KEY }}
          script: |
            set -eu
            stage=/var/tmp/vvault-wazuh-manager-deploy
            test ! -L "${stage}"
            rm -rf -- "${stage}"
            install -d -m 0700 "${stage}"
      - name: Stage bounded installer
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 165.245.136.194
          username: deploy
          key: ${{ secrets.VVAULT_DEPLOY_KEY }}
          source: scripts/install-wazuh-manager.sh
          target: /var/tmp/vvault-wazuh-manager-deploy
      - name: Install and verify manager-only topology
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 165.245.136.194
          username: deploy
          key: ${{ secrets.VVAULT_DEPLOY_KEY }}
          command_timeout: 25m
          script: |
            set -eu
            installer=/var/tmp/vvault-wazuh-manager-deploy/scripts/install-wazuh-manager.sh
            test -f "${installer}"
            test ! -L "${installer}"
            chmod 0600 "${installer}"
            sudo -n /usr/local/libexec/vvault-wazuh-manager-install
            dpkg-query -W -f='${Version}' wazuh-manager | grep -qx '4.14.7-1'
            systemctl is-active wazuh-manager >/dev/null
            test ! -e /usr/share/wazuh-indexer
            test ! -e /usr/share/wazuh-dashboard
            test ! -e /etc/filebeat
            ss -ltn | grep -Eq '127\.0\.0\.1:55000'
            ss -ltn | grep -Eq '(^|[[:space:]])[^[:space:]]*:1514([[:space:]]|$)'
            if ss -ltn | grep -Eq '(^|[[:space:]])(0\.0\.0\.0|\[::\]):55000([[:space:]]|$)'; then
              echo 'Wazuh API is exposed beyond loopback' >&2
              exit 1
            fi
            curl --fail --silent --show-error http://127.0.0.1:8000/api/ready >/dev/null
